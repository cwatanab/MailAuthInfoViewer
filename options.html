<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>MailAuthInfoViewer - Options</title>
<style>
  /* DESIGN.md — デジタル庁デザインシステム (DADS) 準拠スタイル */
  :root {
    /* キーカラー（Primary Blue） */
    --dads-primary: #0050a4;
    --dads-primary-hover: #003a7a;
    --dads-primary-active: #002752;
    --dads-primary-tint: #e6f0fa;
    --dads-on-primary: #ffffff;

    /* セマンティックカラー */
    --dads-danger: #c51b24;
    --dads-danger-hover: #a3141c;
    --dads-danger-bg: #fdefef;
    --dads-success: #007b43;

    /* ニュートラルカラー */
    --dads-text-primary: #1a1a1a;
    --dads-text-secondary: #4d4d4d;
    --dads-text-muted: #666666;
    --dads-border: #b3b3b3;
    --dads-border-subtle: #e0e0e0;
    --dads-canvas: #ffffff;
    --dads-canvas-subtle: #f5f7fa;

    /* スペーシングスケール（8pxモジュラースケール） */
    --dads-space-xxs: 4px;
    --dads-space-xs: 8px;
    --dads-space-sm: 12px;
    --dads-space-md: 16px;
    --dads-space-lg: 24px;

    /* 角の形状 */
    --dads-radius-none: 0px;
    --dads-radius-sm: 4px;
    --dads-radius-md: 6px;
    --dads-radius-pill: 9999px;

    /* フォントスタック */
    --dads-font: "Noto Sans JP", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    --dads-font-mono: "Noto Sans Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

    /* DADS 規定 2重フォーカスインジケーター */
    --dads-focus-ring: 2px solid #ffd43b;
    --dads-focus-shadow: 0 0 0 2px #000000;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --dads-primary: #66b0ff;
      --dads-primary-hover: #80beff;
      --dads-primary-active: #4d9fff;
      --dads-primary-tint: #162a45;
      --dads-on-primary: #000000;

      --dads-danger: #f87171;
      --dads-danger-hover: #fca5a5;
      --dads-danger-bg: #2b1414;
      --dads-success: #4ade80;

      --dads-text-primary: #ffffff;
      --dads-text-secondary: #d1d5db;
      --dads-text-muted: #9ca3af;
      --dads-border: #4d515a;
      --dads-border-subtle: #333740;
      --dads-canvas: #18191c;
      --dads-canvas-subtle: #222429;

      --dads-focus-ring: 2px solid #ffd43b;
      --dads-focus-shadow: 0 0 0 2px #ffffff;
    }
  }

  * { box-sizing: border-box; }

  body {
    font-family: var(--dads-font);
    max-width: 760px;
    margin: var(--dads-space-md) auto;
    padding: 0 var(--dads-space-md);
    color: var(--dads-text-primary);
    background: var(--dads-canvas-subtle);
    font-size: 14px;
    font-weight: 400;
    line-height: 1.5;
    letter-spacing: 0;
  }

  h1 {
    font-size: 20px;
    font-weight: 700;
    line-height: 1.3;
    border-bottom: 2px solid var(--dads-primary);
    padding-bottom: var(--dads-space-xxs);
    margin: 0 0 var(--dads-space-md) 0;
    color: var(--dads-text-primary);
  }

  h2 {
    font-size: 16px;
    font-weight: 700;
    line-height: 1.3;
    margin: 0 0 var(--dads-space-xxs) 0;
    color: var(--dads-text-primary);
  }

  p.desc {
    font-size: 13px;
    font-weight: 400;
    line-height: 1.45;
    color: var(--dads-text-secondary);
    margin: 0 0 var(--dads-space-sm) 0;
  }

  .settings-grid {
    display: grid;
    grid-template-columns: 240px 1fr;
    gap: var(--dads-space-md);
    align-items: start;
  }

  /* DADS カードコンポーネント準拠 (外周枠線 >= 3:1 コントラスト) */
  .settings-section {
    min-width: 0;
    padding: var(--dads-space-md);
    border: 1px solid var(--dads-border);
    border-radius: var(--dads-radius-md);
    background: var(--dads-canvas);
    box-shadow: none;
  }

  @media (max-width: 600px) {
    .settings-grid { grid-template-columns: minmax(0, 1fr); }
    .settings-section { padding: var(--dads-space-sm); }
  }

  /* DADS チェックボックス準拠 */
  .checkbox-row {
    display: inline-flex;
    align-items: center;
    gap: var(--dads-space-xs);
    margin-bottom: var(--dads-space-xs);
    cursor: pointer;
    user-select: none;
  }

  .checkbox-row input[type="checkbox"] {
    width: 18px;
    height: 18px;
    margin: 0;
    cursor: pointer;
    accent-color: var(--dads-primary);
    border-radius: 3px;
    flex-shrink: 0;
  }

  .checkbox-row input[type="checkbox"]:focus-visible {
    outline: var(--dads-focus-ring);
    outline-offset: 1px;
    box-shadow: var(--dads-focus-shadow);
  }

  .checkbox-row span {
    font-size: 14px;
    font-weight: 500;
    color: var(--dads-text-primary);
  }

  /* DADS 入力テキスト準拠 */
  .add-row {
    display: flex;
    gap: var(--dads-space-xs);
    margin-bottom: var(--dads-space-xs);
  }

  .add-row input {
    flex: 1;
    min-width: 0;
    padding: 0 12px;
    height: 36px;
    font-size: 13.5px;
    font-family: var(--dads-font-mono);
    border: 1px solid var(--dads-border);
    border-radius: var(--dads-radius-sm);
    background: var(--dads-canvas);
    color: var(--dads-text-primary);
    outline: none;
    line-height: 34px;
  }

  .add-row input::placeholder {
    color: var(--dads-text-muted);
  }

  .add-row input:focus-visible {
    outline: var(--dads-focus-ring);
    outline-offset: 1px;
    box-shadow: var(--dads-focus-shadow);
  }

  /* DADS ボタンコンポーネント準拠 */
  button {
    font-family: var(--dads-font);
    font-size: 13px;
    font-weight: 700;
    line-height: 1.2;
    height: 32px;
    padding: 0 14px;
    border-radius: var(--dads-radius-sm);
    cursor: pointer;
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    box-sizing: border-box;
    transition: background 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
  }

  button:active { transform: scale(0.97); }

  button:focus-visible {
    outline: var(--dads-focus-ring);
    outline-offset: 1px;
    box-shadow: var(--dads-focus-shadow);
  }

  /* セカンダリーボタン (標準アウトライン) */
  button:not(.primary):not(.danger) {
    background: var(--dads-canvas);
    color: var(--dads-primary);
    border: 1px solid var(--dads-primary);
  }

  button:not(.primary):not(.danger):hover {
    background: var(--dads-primary-tint);
  }

  /* プライマリーボタン (塗りボタン) */
  button.primary {
    background: var(--dads-primary);
    color: var(--dads-on-primary);
    border: 1px solid var(--dads-primary);
    height: 36px;
    padding: 0 16px;
  }

  button.primary:hover {
    background: var(--dads-primary-hover);
    border-color: var(--dads-primary-hover);
  }

  button.primary:active {
    background: var(--dads-primary-active);
    border-color: var(--dads-primary-active);
  }

  /* 削除ボタン (Danger アウトライン) */
  button.danger {
    color: var(--dads-danger);
    border: 1px solid var(--dads-danger);
    background: transparent;
    font-size: 12px;
    height: 26px;
    padding: 0 8px;
    border-radius: var(--dads-radius-sm);
  }

  button.danger:hover {
    background: var(--dads-danger-bg);
    border-color: var(--dads-danger-hover);
  }

  /* DADS リソースリスト / テーブル準拠 */
  .domain-list {
    border: 1px solid var(--dads-border);
    border-radius: var(--dads-radius-sm);
    overflow: hidden;
    min-height: 40px;
    background: var(--dads-canvas);
  }

  .domain-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 12px;
    border-bottom: 1px solid var(--dads-border-subtle);
    font-size: 13px;
    font-family: var(--dads-font-mono);
    color: var(--dads-text-primary);
    gap: var(--dads-space-xs);
    overflow-wrap: anywhere;
    transition: background 0.1s ease;
  }

  .domain-item:last-child { border-bottom: none; }
  .domain-item:nth-child(even) { background: var(--dads-canvas-subtle); }
  .domain-item:hover { background: var(--dads-primary-tint); }

  .empty {
    padding: var(--dads-space-md);
    text-align: center;
    color: var(--dads-text-muted);
    font-size: 13px;
    font-style: italic;
  }

  .actions {
    display: flex;
    gap: var(--dads-space-xs);
    margin-top: var(--dads-space-sm);
  }

  .status {
    font-size: 12px;
    font-weight: 700;
    line-height: 1.2;
    color: var(--dads-success);
    margin-top: 6px;
    min-height: 16px;
  }
</style>
</head>
<body>
  <h1 id="title"></h1>

  <main class="settings-grid">
    <section class="settings-section" aria-labelledby="displayTitle">
      <h2 id="displayTitle"></h2>
      <p class="desc" id="displayDesc"></p>
      <label class="checkbox-row">
        <input type="checkbox" id="compactMode">
        <span id="compactLabel"></span>
      </label>
    </section>

    <section class="settings-section" aria-labelledby="whitelistTitle">
      <h2 id="whitelistTitle"></h2>
      <p class="desc" id="whitelistDesc"></p>

      <div class="add-row">
        <input type="text" id="domainInput" placeholder="example.com">
        <button class="primary" id="addBtn"></button>
      </div>

      <div class="domain-list" id="domainList"></div>

      <div class="actions">
        <button id="exportBtn"></button>
        <button id="importBtn"></button>
        <input type="file" id="importFile" accept=".txt,.text" style="display:none;">
      </div>
      <div class="status" id="status"></div>
    </section>
  </main>

  <script src="options.js"></script>
</body>
</html>
